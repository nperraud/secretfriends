<!doctype html>
<html>

    <head>

        <meta charset="utf-8" />
        <title>Secret Santa Generator</title>

        <script src="vendors/Lodash-3.10.1.js"></script>
        <script src="vendors/Cryptojs.aes-3.1.2.js"></script>

        <script src="./SecretSanta.js"></script>
        <script src="./translations.js"></script>

        <style>

            * {
                box-sizing: border-box;
            }

            html, body, .main {
                margin: 0;

                width: 100%;
                height: 100%;

                padding: 0;
            }

            body {
                background-image: url(assets/santa.png);
                background-position: bottom right;
                background-repeat: no-repeat;

                font-family: 'Comic Sans MS';
            }

            .main {
                display: flex;
            }

            .part {
                display: flex;
                flex-direction: column;

                padding: 20px;

                flex: 1;
            }

            .instructions {
                margin: auto 10%;
            }

            .instructions a {
                text-decoration: none;

                color: #0CB50C;
            }

            .input {
                display: block;
                align-self: stretch;

                width: 100%;
                flex: auto;

                border: 10px solid #0CB50C;
                border-radius: 10px;

                padding: 15px;

                background-color: rgba(255, 255, 255, .7);
                outline: none;
            }

            .generate {
                display: block;

                margin-top: 20px;

                flex: none;
                height: 100px;

                border: 10px solid #0CB50C;
                border-radius: 10px;

                font-family: inherit;
                font-size: 40px;

                background-color: #EA1212;
                color: #FFFFFF;
            }

            .generate:focus {
                border-color: #E6E020;

                outline: none;
            }

            .result {
                margin-top: 20px;

                flex: none;

                border: 10px solid #E6E020;
                border-radius: 10px;

                padding: 15px;

                background: #FFFFFF;
            }

            .result a {
                color: blue;
            }

            .result.none {
                display: none;
            }

            .result.error {
                border-color: #EA1212;

                color: #EA1212;
            }

            .result-table {
                table-layout: fixed;

                width: 100%;
            }

            .result-name {
                width: 30%;

                padding: 5px 8px;
            }

            .result-link {
                width: 100%;
                overflow: hidden;

                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .language-selector {
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 1000;
            }

            .language-selector select {
                padding: 8px 12px;
                border: 3px solid #0CB50C;
                border-radius: 5px;
                background-color: rgba(255, 255, 255, .9);
                font-family: 'Comic Sans MS';
                font-size: 14px;
                cursor: pointer;
                outline: none;
            }

            .language-selector select:hover {
                border-color: #E6E020;
            }

        </style>

    </head>

    <body>

        <div class="language-selector">
            <select id="language-selector">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
            </select>
        </div>

        <div class="main">

            <div class="part" style="overflow-y: auto">
                <div class="instructions">
                    <h1><img src="assets/mistletoe.png" style="vertical-align: middle" /> <span id="title-text">Secret Santa Generator</span></h1>
                    <p id="subtitle-text"></p>
                    <p id="instructions-text"></p>
                    <h2 id="origin-title-text"></h2>
                    <p id="origin-text"></p>
                </div>
            </div>

            <form id="form" class="part">
                <textarea id="input" class="input" autofocus></textarea>
                <button type="submit" class="generate" id="generate-button">Generate your pairings</button>
                <div id="result" class="result none"></div>
            </form>

        </div>

        <script id="input-placeholder" type="text/placeholder"></script>

    </body>

    <script>

      var currentLang = getCurrentLanguage();

      function updateLanguage(lang) {
          currentLang = lang;
          setCurrentLanguage(lang);
          
          // Update page title
          document.title = translate('title', currentLang);
          
          // Update UI elements
          document.getElementById('title-text').textContent = translate('title', currentLang);
          document.getElementById('subtitle-text').innerHTML = translate('subtitle', currentLang);
          document.getElementById('instructions-text').textContent = translate('instructions', currentLang);
          document.getElementById('origin-title-text').textContent = translate('originTitle', currentLang);
          document.getElementById('origin-text').textContent = translate('originText', currentLang);
          document.getElementById('generate-button').textContent = translate('generateButton', currentLang);
          
          // Update placeholder
          document.getElementById('input').placeholder = translate('placeholder', currentLang);
          
          // Update language selector
          document.getElementById('language-selector').value = currentLang;
      }

      function isAmazonEnabled() {

          const checkBox = document.getElementById('amazon');

          return checkBox ? checkBox.checked : false;

      }

      function persist() {

          if ( ! window.localStorage )
              return ;

          var amazon = isAmazonEnabled();
          var content = document.getElementById( 'input' ).value;

          window.localStorage.setItem( 'amazon', amazon );
          window.localStorage.setItem( 'input', content );

      }

      function restore() {

          if ( ! window.localStorage )
              return ;

          var amazon = window.localStorage.getItem( 'amazon' );
          var content = window.localStorage.getItem( 'input' );

          if (typeof amazon === 'undefined')
              amazon = true;

          if (typeof content === 'undefined')
              content = '';

          if ( document.getElementById( 'amazon' ) )
              document.getElementById( 'amazon' ).checked = amazon;

          document.getElementById( 'input' ).value = content;

      }

      function reset() {

          var result = document.getElementById( 'result' );

          result.classList.add( 'none' );
          result.classList.remove( 'error' );

      }

      function error(text) {

          var result = document.getElementById( 'result' );

          result.classList.remove( 'none' );
          result.classList.add( 'error' );

          // Try to translate error messages
          var translatedText = text;
          
          // Translate common error patterns
          if (text.indexOf('Cannot redefine') !== -1) {
              var match = text.match(/Cannot redefine (.+)/);
              if (match) {
                  translatedText = translate('errors.cannotRedefine', currentLang, { name: match[1] });
              }
          } else if (text.indexOf("hasn't been declared as a possible pairing") !== -1) {
              var match = text.match(/(.+) is paired with (.+), which hasn't been declared/);
              if (match) {
                  translatedText = translate('errors.notDeclared', currentLang, { name: match[1], enforced: match[2] });
              }
          } else if (text.indexOf('multiple persons are paired with') !== -1) {
              var match = text.match(/multiple persons are paired with (.+)/);
              if (match) {
                  translatedText = translate('errors.multiplePairings', currentLang, { enforced: match[1] });
              }
          } else if (text.indexOf("We haven't been able to find a match") !== -1) {
              var match = text.match(/We haven't been able to find a match for (.+)!/);
              if (match) {
                  translatedText = translate('errors.noMatch', currentLang, { name: match[1] });
              }
          } else if (text.indexOf("Syntax error") !== -1) {
              var match = text.match(/Syntax error: "(.+)" isn't valid/);
              if (match) {
                  translatedText = translate('syntaxError', currentLang, { line: match[1] });
              }
          }

          result.innerText = translatedText;

      }

      function success( pairings ) {

          var result = document.getElementById( 'result' );

          result.classList.remove( 'none' );
          result.classList.remove( 'error' );

          result.innerHTML = '';

          var table = document.createElement( 'table' );
          table.className = 'result-table';
          result.appendChild( table );

          var names = Object.keys( pairings ).sort();

          for ( var t = 0, T = names.length; t < T; ++ t ) {

              var name = names[ t ];
              var prettyName = names[ t ].replace( /\([^)]+\)/g, ' ' ).replace( / +/g, ' ' ).trim();

              var tr = document.createElement( 'tr' );
              tr.className = 'result-row';
              table.appendChild( tr );

              var tdName = document.createElement( 'td' );
              tdName.className = 'result-name';
              tr.appendChild( tdName );

              var tdLink = document.createElement( 'td' );
              tdLink.className = 'result-link';
              tr.appendChild( tdLink );

              var link = document.createElement( 'a' );
              tdLink.appendChild( link );

              var key = String( _.random( 0x0000, 0xFFFF ) );
              var encryptedPairing = CryptoJS.AES.encrypt( pairings[ name ], key );

              var pairingPath = window.location.pathname.replace( /[^/]+$/, '' ) + 'pairing.html';
              var pairingQueryString = '?name=' + encodeURIComponent( prettyName ) + '&key=' + encodeURIComponent( key ) + '&pairing=' + encodeURIComponent( encryptedPairing ) + '&lang=' + encodeURIComponent( currentLang );

              if ( isAmazonEnabled() )
                  pairingQueryString += '&extra=1';

              tdName.innerText = name;

              link.addEventListener( 'click', protect );
              link.setAttribute( 'data-name', name );
              link.href = window.location.protocol + '//' + window.location.host + pairingPath + pairingQueryString;
              link.target = '_blank';
              link.innerText = link.href;

          }

      }

      function updateAmazon() {

          var result = document.getElementById( 'result' );
          var links = result.getElementsByTagName( 'a' );

          for ( var t = 0; t < links.length; ++t ) {

              var link = links[t];

              if ( isAmazonEnabled() )
                  link.href += '&extra=1';
              else
                  link.href = link.href.replace( /&extra=[01]/, '' );

              link.innerText = link.href;

          }

      }

      function generate( e ) {

          e.preventDefault();

          var content = document.getElementById( 'input' ).value;

          // Convert carriage returns into line feeds
          content = content.replace( /(\r\n|\r)/g, '\n' );

          // Merge adjacent blank characters into a single space
          content = content.replace( /[ \t]+/g, ' ' );

          // Trim lines
          content = content.replace( /^ | $/gm, '' );

          // Strip comments
          content = content.replace( /^#.*$/gm, '' );

          // Strip empty lines
          content = content.replace( /\n+/g, '\n' );

          // Remove leading/trailing newlines
          content = content.replace( /^\n|\n$/g, '' );

          var lines = content.split( /\n/g );

          if ( lines.length === 0 || lines.length === 1 && lines[ 0 ].length === 0 )
              return reset();

          var santa = new SecretSanta();

          for ( var t = 0, T = lines.length; t < T; ++ t ) {

              var match = lines[ t ].match( /^((?:(?![!=]).)+)((?: [!=](?:(?! [!=]).)+)*)$/ );

              if ( ! match )
                  return error( translate('syntaxError', currentLang, { line: lines[t] }) );

              var name = match[ 1 ];
              var rules = match[ 2 ] ? match[ 2 ].match(/[!=][^!=]+/g) : null;

              var person = santa.add( name );

              if (rules) {

                  for ( var u = 0, U = rules.length; u < U; ++ u ) {

                      var fnName = {

                          '=': 'enforce',
                          '!': 'blacklist'

                      }[ rules[ u ].charAt( 0 ) ];

                      person[ fnName ]( rules[ u ].slice( 1 ).trim() );

                  }

              }

          }

          try {
              return success( santa.generate() );
          } catch ( err ) {
            console.error(err.stack)
              return error( err.message );
          }

      }

      function protect( e ) {

          var name = e.currentTarget.getAttribute( 'data-name' );
          var confirmText = translate('protectConfirm', currentLang, { name: name });

          if ( ! confirm( confirmText ) ) {
              e.preventDefault();
          }

      }

    </script>

    <script>

        // Initialize language
        updateLanguage(currentLang);
        
        // Language selector change handler
        document.getElementById('language-selector').addEventListener('change', function(e) {
            updateLanguage(e.target.value);
        });

        document.getElementById( 'input' ).addEventListener( 'change', persist );

        if ( document.getElementById( 'amazon' ) ) {
            document.getElementById( 'amazon' ).addEventListener( 'change', updateAmazon );
            document.getElementById( 'amazon' ).addEventListener( 'change', persist );
        }

        document.getElementById( 'form' ).addEventListener( 'submit', generate );

        restore();

    </script>

</html>
